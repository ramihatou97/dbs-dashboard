        let map;
        let flowLines = [];
        let showFlows = false;

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 5.5,
                center: { lat: 56.1304, lng: -106.3468 },
                mapTypeId: 'roadmap',
                styles: [
                    { featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] }
                ]
            });

            // Controls
            const controls = document.createElement('div');
            controls.className = 'controls';
            controls.innerHTML = `
                <div class="control-label">Flow Lines</div>
                <button id="toggleFlows" onclick="toggleFlowLines()">Show Flow Lines</button>
                <button onclick="toggleFlowLines(true)">Hide Flow Lines</button>
            `;
            map.controls[google.maps.ControlPosition.TOP_CENTER].push(controls);

            // Legend with center rankings
            const legend = document.createElement('div');
            legend.className = 'legend';
            let legendHTML = '<div class="legend-title">Center Rankings by FSA Count</div>';

            centerData.sort((a, b) => b.fsa_count - a.fsa_count).slice(0, 8).forEach((center, idx) => {
                legendHTML += `
                    <div class="legend-item">
                        <span class="center-name">${idx + 1}. ${center.name.substring(0, 30)}${center.name.length > 30 ? '...' : ''}</span>
                        <span class="center-stat">${center.fsa_count} (${center.percentage}%)</span>
                    </div>
                `;
            });
            legend.innerHTML = legendHTML;
            map.controls[google.maps.ControlPosition.RIGHT_TOP].push(legend);

            // Add center markers
            centerData.forEach(center => {
                const marker = new google.maps.Marker({
                    position: { lat: center.lat, lng: center.lng },
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: center.scale,
                        fillColor: '#1e40af',
                        fillOpacity: 0.9,
                        strokeColor: '#fff',
                        strokeWeight: 4
                    },
                    title: center.name,
                    zIndex: 1000
                });

                const infoWindow = new google.maps.InfoWindow({
                    content: `
                        <div style="font-family: system-ui; padding: 14px; min-width: 280px;">
                            <h3 style="margin: 0 0 12px 0; color: #1e40af; font-size: 18px;">${center.name}</h3>
                            <div style="background: #dbeafe; padding: 12px; border-radius: 6px; margin-bottom: 12px;">
                                <div style="font-size: 24px; font-weight: 700; color: #1e40af; margin-bottom: 4px;">
                                    ${center.fsa_count} FSAs
                                </div>
                                <div style="color: #374151; font-size: 14px;">
                                    <strong>${center.percentage}%</strong> of all FSAs
                                </div>
                            </div>
                            <div style="color: #6b7280; font-size: 12px;">
                                Click "Show Flow Lines" to visualize patient flows
                            </div>
                        </div>
                    `
                });

                marker.addListener('click', () => {
                    infoWindow.open(map, marker);
                });
            });
        }

        function toggleFlowLines(hide = false) {
            if (hide || showFlows) {
                // Remove existing lines
                flowLines.forEach(line => line.setMap(null));
                flowLines = [];
                showFlows = false;
            } else {
                // Show flow lines (sample to avoid clutter - show every 5th)
                flowData.filter((_, idx) => idx % 5 === 0).forEach(flow => {
                    const line = new google.maps.Polyline({
                        path: [
                            { lat: flow.fsa_lat, lng: flow.fsa_lng },
                            { lat: flow.center_lat, lng: flow.center_lng }
                        ],
                        geodesic: true,
                        strokeColor: flow.distance > 500 ? '#dc2626' : '#3b82f6',
                        strokeOpacity: 0.3,
                        strokeWeight: 1.5,
                        map: map
                    });
                    flowLines.push(line);
                });
                showFlows = true;
            }
        }

        window.onload = initMap;
    </script>
