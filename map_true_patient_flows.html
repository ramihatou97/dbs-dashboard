        function getFlowColor(distance) {
            if (distance < 50) return '#10b981';
            if (distance < 100) return '#84cc16';
            if (distance < 200) return '#eab308';
            if (distance < 500) return '#f97316';
            return '#dc2626';
        }

        function getFlowStyle(distance) {
            if (distance < 50) return { weight: 0.6, opacity: 0.2 };
            if (distance < 100) return { weight: 0.8, opacity: 0.25 };
            if (distance < 200) return { weight: 1, opacity: 0.3 };
            if (distance < 500) return { weight: 1.2, opacity: 0.35 };
            return { weight: 1.5, opacity: 0.42 };
        }

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 4,
                center: { lat: 56.1304, lng: -106.3468 },
                mapTypeId: 'roadmap'
            });

            // Controls
            const controls = document.createElement('div');
            controls.className = 'controls';
            controls.innerHTML = `
                <button onclick="toggleFlows()">Show All Flows</button>
                <button onclick="toggleFlows(true)">Hide Flows</button>
                <span style="margin-left: 15px; font-weight: 600;">920 Actual Patient Flows</span>
            `;
            map.controls[google.maps.ControlPosition.TOP_CENTER].push(controls);

            // Add DBS center markers
            const centers = {'Toronto Western Hospital': (43.6532, -79.3832), "Centre hospitalier de l'Université de Montréal": (45.5017, -73.5673), 'London Health Sciences': (43.0096, -81.2737), 'Ottawa Civic Hospital': (45.4215, -75.6972), 'QEII Health Sciences Centre, Halifax': (44.6369, -63.5906), 'University of Alberta Hospital': (53.5461, -113.4938), 'Foothills Hospital': (51.0447, -114.0719), 'Université de Sherbrooke, Centre Hospitalier': (45.4042, -71.8929), "Hôpital de L'Enfant Jésus, Quebec": (46.8139, -71.208), 'Royal University Hospital, Saskatoon': (52.1332, -106.67)};
            Object.entries(centers).forEach(([name, coords]) => {
                new google.maps.Marker({
                    position: { lat: coords[0], lng: coords[1] },
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 18,
                        fillColor: '#1e40af',
                        fillOpacity: 0.9,
                        strokeColor: '#ffffff',
                        strokeWeight: 2
                    },
                    title: name,
                    zIndex: 1000
                });
            });
        }

        function toggleFlows(hide = false) {
            if (hide || showFlows) {
                flowLines.forEach(line => line.setMap(null));
                flowLines = [];
                showFlows = false;
            } else {
                // Show all flows (sample every 3rd to avoid overwhelming the map)
                const sampled = flowData.filter((_, idx) => idx % 3 === 0);

                sampled.forEach(flow => {
                    const color = getFlowColor(flow.distance);
                    const style = getFlowStyle(flow.distance);

                    const line = new google.maps.Polyline({
                        path: [
                            { lat: flow.fsa_lat, lng: flow.fsa_lng },
                            { lat: flow.center_lat, lng: flow.center_lng }
                        ],
                        geodesic: true,
                        strokeColor: color,
                        strokeOpacity: style.opacity,
                        strokeWeight: style.weight,
                        icons: [{
                            icon: {
                                path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                                scale: 1.5,
                                strokeWeight: 0.8,
                                strokeColor: '#ffffff',
                                fillColor: color,
                                fillOpacity: 0.9
                            },
                            offset: '50%'
                        }],
                        map: map
                    });

                    // Add hover tooltip
                    const infoWindow = new google.maps.InfoWindow();
                    line.addListener('mouseover', (e) => {
                        infoWindow.setContent(`
                            <div style="font-family: system-ui; padding: 8px;">
                                <strong style="color: ${color};">${flow.fsa} → ${flow.center}</strong><br/>
                                Distance: <strong>${Math.round(flow.distance)} km</strong>
                            </div>
                        `);
                        infoWindow.setPosition(e.latLng);
                        infoWindow.open(map);
                    });

                    line.addListener('mouseout', () => {
                        infoWindow.close();
                    });

                    flowLines.push(line);
                });

                showFlows = true;
            }
        }
