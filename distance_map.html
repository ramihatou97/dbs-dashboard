        function initMap() {

            const heatmapData = fsaData.map(fsa => ({
                location: new google.maps.LatLng(fsa.lat, fsa.lng),
                weight: fsa.distance / 10

        function filterMarkers() {
            const filter = document.getElementById('distance-filter').value;

            fsaMarkers.forEach(marker => {
                const distance = marker.data.distance;
                let show = true;

                if (filter !== 'all') {
                    const [min, max] = filter.split('-').map(v => v.replace('+', ''));
                    if (max) {
                        show = distance >= parseFloat(min) && distance < parseFloat(max);
                    } else {
                        show = distance >= parseFloat(min);
                    }
                }

                marker.setVisible(show);
            });
        }

        <div class="loading-content">
            <div class="spinner"></div>
            <p>Generating download...</p>
        </div>
    </div>

    <script>
        function showOverlay() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideOverlay() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        async function downloadMapPNG() {
            showOverlay();
            try {
                const mapDiv = document.body;
                const canvas = await html2canvas(mapDiv, {
                    useCORS: true,
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false
                });

                const link = document.createElement('a');
                const filename = document.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                link.download = `${filename}_${new Date().toISOString().split('T')[0]}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                hideOverlay();
            } catch (error) {
                console.error('Download failed:', error);
                alert('Download failed. Please try again.');
                hideOverlay();
            }
        }

        async function downloadMapPDF() {
            showOverlay();
            try {
                const mapDiv = document.body;
                const canvas = await html2canvas(mapDiv, {
                    useCORS: true,
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false
                });

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('landscape', 'mm', 'a4');

                const imgData = canvas.toDataURL('image/png');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);

                const filename = document.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                pdf.save(`${filename}_${new Date().toISOString().split('T')[0]}.pdf`);

                hideOverlay();
            } catch (error) {
                console.error('PDF generation failed:', error);
                alert('PDF generation failed. Please try again.');
                hideOverlay();
            }
        }
    </script>
